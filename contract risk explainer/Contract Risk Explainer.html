<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contract Risk Explainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body { background: #f0eee9; font-family: "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="cre-shared.js"></script>
<script src="playbook.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="artboard-dashboard.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "editorial",
  "density": "cozy",
  "attribution": true,
  "fontPairing": "serif-sans"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const fontCss = React.useMemo(() => {
    if (t.fontPairing === "all-sans") {
      return `.fp-body{font-family: "Inter", system-ui, sans-serif !important;}`;
    }
    if (t.fontPairing === "mono-display") {
      return `.fp-body{font-family: "JetBrains Mono", ui-monospace, monospace !important; letter-spacing: -0.5px;}`;
    }
    return ``;
  }, [t.fontPairing]);

  return (
    <>
      <style>{fontCss}</style>
      <div className="fp-body" style={{ width: "100vw", height: "100vh" }}>
        <RiskDashboard tweaks={t} />
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Risk palette" />
        <TweakRadio label="Style" value={t.palette}
          options={[
            { value: "editorial", label: "Editorial" },
            { value: "traffic", label: "Traffic" },
            { value: "mono", label: "Mono" },
          ]}
          onChange={(v) => setTweak("palette", v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={[
            { value: "compact", label: "Compact" },
            { value: "comfortable", label: "Comfy" },
            { value: "cozy", label: "Cozy" },
          ]}
          onChange={(v) => setTweak("density", v)} />

        <TweakSection label="Attribution" />
        <TweakToggle label="Show token heatmap" value={t.attribution}
          onChange={(v) => setTweak("attribution", v)} />

        <TweakSection label="Type pairing" />
        <TweakRadio label="Body" value={t.fontPairing}
          options={[
            { value: "serif-sans", label: "Serif" },
            { value: "all-sans", label: "Sans" },
            { value: "mono-display", label: "Mono" },
          ]}
          onChange={(v) => setTweak("fontPairing", v)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
